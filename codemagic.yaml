# Codemagic CI/CD 配置文件
# 项目：RemoteControl（局域网远程桌面控制 App）
# 构建产物：app/build/outputs/apk/debug/app-debug.apk

workflows:
  remote-control-android:
    name: RemoteControl Android
    max_build_duration: 60

    environment:
      java: "17"
      vars:
        PACKAGE_NAME: com.example.remotecontrol

    triggering:
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
      tag_patterns:
        - pattern: "v*"
          include: true

    scripts:
      - name: 打印环境信息
        script: |
          echo "== Codemagic 构建环境 =="
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          java -version
          echo "Android SDK: $ANDROID_SDK_ROOT"

      - name: 生成 local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          cat "$CM_BUILD_DIR/local.properties"

      - name: 构建 Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          # 检查 gradle 版本
          gradle --version
          # 直接用系统 gradle 构建
          gradle :app:assembleDebug --stacktrace --no-daemon

      - name: 列出构建产物
        script: |
          echo "== 构建产物 =="
          find "$CM_BUILD_DIR/app/build/outputs" -type f \( -name "*.apk" -o -name "*.aab" \) -exec ls -lh {} \;

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab

    cache:
      cache_paths:
        - /root/.gradle/caches
        - /root/.gradle/wrapper
