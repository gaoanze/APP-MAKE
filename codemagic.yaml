# Codemagic CI/CD 配置文件
# 项目：RemoteControl（局域网远程桌面控制 App）

workflows:
  remote-control-android:
    name: RemoteControl Android
    max_build_duration: 60

    environment:
      java: "17"
      vars:
        PACKAGE_NAME: com.example.remotecontrol

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: 打印环境信息
        script: |
          echo "========== 环境信息 =========="
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          echo "Java版本:"
          java -version 2>&1
          echo ""
          echo "Android SDK: $ANDROID_SDK_ROOT"
          echo "SDK 目录内容:"
          ls -la $ANDROID_SDK_ROOT 2>&1 || echo "SDK 目录不存在"
          echo ""
          echo "Gradle版本:"
          gradle --version 2>&1
          echo ""
          echo "CM_BUILD_DIR 内容:"
          ls -la $CM_BUILD_DIR
          echo "=============================="

      - name: 生成 local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"
          cat "$CM_BUILD_DIR/local.properties"

      - name: 构建 Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          echo "开始构建..."
          gradle :app:assembleDebug --stacktrace --no-daemon --info 2>&1 | head -200
          echo "构建完成，退出码: $?"

      - name: 列出构建产物
        script: |
          echo "== 构建产物 =="
          find "$CM_BUILD_DIR/app/build/outputs" -type f 2>&1 || echo "没有产物目录"

    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/outputs/**/*.aab

    cache:
      cache_paths:
        - /root/.gradle/caches
        - /root/.gradle/wrapper
