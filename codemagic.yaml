# Codemagic CI/CD 配置文件
# 项目：RemoteControl（局域网远程桌面控制 App）

workflows:
  remote-control-android:
    name: RemoteControl Android
    max_build_duration: 60

    environment:
      java: "17"
      vars:
        PACKAGE_NAME: com.example.remotecontrol

    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true

    scripts:
      - name: 打印环境信息
        script: |
          echo "========== 环境信息 =========="
          echo "CM_BUILD_DIR: $CM_BUILD_DIR"
          java -version 2>&1
          echo "Android SDK: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_SDK_ROOT 2>&1 || echo "SDK 不存在"
          gradle --version 2>&1
          echo "工程目录:"
          ls -la $CM_BUILD_DIR
          echo "=============================="

      - name: 生成 local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/local.properties"

      - name: 构建 Debug APK
        script: |
          cd "$CM_BUILD_DIR"
          gradle clean :app:assembleDebug --stacktrace --no-daemon

      - name: 列出构建产物
        script: |
          echo "== 查找 APK =="
          find $CM_BUILD_DIR -name "*.apk" -type f 2>&1
          echo "== app/build/outputs 目录 =="
          ls -laR $CM_BUILD_DIR/app/build/outputs 2>&1 || echo "目录不存在"

    artifacts:
      - "**/*.apk"

    cache:
      cache_paths:
        - /root/.gradle/caches
        - /root/.gradle/wrapper
